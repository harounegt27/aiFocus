spring.application.name=aiFocus
spring.datasource.url=jdbc:postgresql://localhost:5432/focus_db
spring.datasource.username=postgres
spring.datasource.password=adminadmin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# JWT Configuration
app.jwt.secret=YOUR_JWT_SECRET_KEY_HERE
app.jwt.expiration=86400000

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Google OAuth Configuration
google.client.id=YOUR_GOOGLE_CLIENT_ID_HERE
google.client.secret=YOUR_GOOGLE_CLIENT_SECRET_HERE
google.redirect.uri=http://localhost:8081/api/calendar/oauth2/callback
google.calendar.scopes=https://www.googleapis.com/auth/calendar.readonly

groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
gemini.api.key=YOUR_GEMINI_API_KEY_HERE
server.port=8081
