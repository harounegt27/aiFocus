spring.application.name=aiFocus
spring.datasource.url=jdbc:postgresql://localhost:5432/focus_db
spring.datasource.username=postgres
spring.datasource.password=adminadmin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true

# JWT Configuration
app.jwt.secret=ElderScrollsOnlineIsTheBestGameEverAndThisIsASecretKey!
app.jwt.expiration=86400000

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Google OAuth Configuration (set these as environment variables for security)
# google.client.id=<set via environment variable>
# google.client.secret=<set via environment variable>
google.redirect.uri=http://localhost:8081/api/calendar/oauth2/callback
google.calendar.scopes=https://www.googleapis.com/auth/calendar.readonly

server.port=8081
